<!DOCTYPE html>
<html>
<head>
    <title>Relationship Simulator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="page-layout">

    <div class="state-panel">
        <h2>Edit State</h2>

        <label for="mood-input">Mood</label>
        <input id="mood-input" type="text" placeholder="affectionate">

        <label for="overthinking-input">Overthinking</label>
        <input id="overthinking-input" type="number" min="0" max="1" step="0.01">

        <label for="attention-input">Attention</label>
        <input id="attention-input" type="number" min="0" max="1" step="0.01">

        <label for="energy-input">Energy</label>
        <input id="energy-input" type="number" min="0" max="1" step="0.01">

        <label for="insecurity-input">Insecurity</label>
        <input id="insecurity-input" type="number" min="0" max="1" step="0.01">

        <label for="attachment-input">Attachment</label>
        <input id="attachment-input" type="number" min="0" max="1" step="0.01">

        <label for="trust-input">Trust</label>
        <input id="trust-input" type="number" min="0" max="1" step="0.01">

        <label for="frustration-input">Frustration</label>
        <input id="frustration-input" type="number" min="0" max="1" step="0.01">

        <label for="intimacy-input">Intimacy</label>
        <input id="intimacy-input" type="number" min="0" max="1" step="0.01">

        <label for="jealousy-input">Jealousy</label>
        <input id="jealousy-input" type="number" min="0" max="1" step="0.01">

        <label for="desire-input">Desire</label>
        <input id="desire-input" type="number" min="0" max="1" step="0.01">

        <label for="situation-input">Situation</label>
        <textarea id="situation-input" class="state-textarea" placeholder="unknown"></textarea>

        <button id="save-state-button" onclick="saveState()">Save State</button>
    </div>

    <div class="chat-container">

        <div id="chat-box"></div>

        <div class="input-container">
            <textarea id="message-input" placeholder="Type a message..."></textarea>
            <button id="send-button" onclick="sendMessage()">Send</button>
            <button id="clear-button" onclick="clearChat()">Clear Chat</button>
        </div>

        <div id="status"></div>

        <div class="analysis-panel">
            <h3>Message Analysis</h3>
            <div id="analysis-view" class="analysis-empty">No analysis yet.</div>
        </div>

    </div>

    <div class="state-panel">
        <h2>Current State</h2>
        <div id="state-view"></div>
    </div>

</div>

<script src="/static/js/chat.js"></script>

</body>
</html>
